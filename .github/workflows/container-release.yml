name: Container release

on:
  workflow_call:
    inputs:
      image-name:
        description: Lowercase GHCR image name without a registry or tag.
        required: true
        type: string
      version:
        description: Numeric semantic version, optionally prefixed with v.
        required: true
        type: string
      context:
        description: Docker build context.
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root.
        required: false
        default: Dockerfile
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, publish, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release coordinates
        id: coordinates
        shell: bash
        env:
          RAW_IMAGE_NAME: ${{ inputs.image-name }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release versions must be numeric semantic versions such as 1.2.3." >&2
            exit 1
          fi

          if [[ ! "$RAW_IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "The image name must be lowercase and must not contain a registry or tag." >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/${RAW_IMAGE_NAME}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build versioned image
        shell: bash
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE: ${{ steps.coordinates.outputs.image }}
          VERSION: ${{ steps.coordinates.outputs.version }}
        run: |
          set -euo pipefail
          docker build --pull --file "$DOCKERFILE" --tag "$IMAGE:$VERSION" "$BUILD_CONTEXT"

      - name: Publish image
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.coordinates.outputs.image }}
          VERSION: ${{ steps.coordinates.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          digest="${image_ref#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.coordinates.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
