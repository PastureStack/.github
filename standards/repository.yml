schema: pasturestack/repository-standard/v1
organization: PastureStack

repository:
  naming: lowercase-kebab-case
  preferred_visibility: public
  staging_visibility: private
  allow_auto_merge: true
  allow_update_branch: true
  delete_head_branch_on_merge: true
  default_branch:
    import_strategy: preserve-source-default
    steady_state: main

required_files:
  - README.md
  - LICENSE

history:
  preserve_commits: true
  preserve_published_tags: true
  rewrite_published_history: false

security:
  organization_configurations:
    default: PastureStack-org-config-1
    advanced_codeql_or_unsupported_language: PastureStack-compatible-security
  dependabot_grouped_security_updates: true
  github_token_default: read
  external_workflow_approval: all-external-contributors
  private_vulnerability_reporting_for_maintained_public_repositories: true

actions:
  artifact_retention_days: 30
  repository_policy: selected
  github_owned_actions: true
  verified_creator_actions: false
  organization_reusable_workflows: PastureStack/.github@*
  require_sha_pinning: false
  new_external_actions_pin: full-commit-sha
  imported_workflows_initial_state: review-before-enable

public_default_branch_rules:
  protected: true
  enforce_administrators: true
  linear_history: true
  conversation_resolution: true
  force_pushes: false
  deletions: false
  pull_request_required: false
  required_checks: add-after-check-names-stabilize

release:
  version_format: numeric-semver
  optional_v_prefix: true
  text_qualifiers_allowed: false
  preserve_published_tags: true
  tag_ruleset:
    name: Require numeric semantic version tags
    enforcement: active
    bypass_allowed: false
    include:
      - refs/tags/v*
      - refs/tags/[0-9]*
    regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
  reuse_upstream_tags_for_rebuilds: false
  checksums_required: true
  checksum_algorithm: sha256
  package_integrity:
    outer_archive_and_inner_payload_are_separate: true
    current_consumer_legacy_fallback_allowed: false
    legacy_sha1_metadata: documented-older-consumers-only
    shared_host_installer_manifests:
      - SHA256SUMS
      - SHA256SUMSSUM
    final_candidate_consumer_verification_required: true
    inherited_and_downloaded_assets_in_scope: true
    negative_cases:
      - missing-manifest
      - sha1-only
      - invalid-manifest
      - modified-payload
    fresh_registration_required_when: package-installer-chain-changed-or-gap-confirmed
    documentation_is_not_ci_enforcement: true
  source_commit_required: true
  compatibility_notes_required: true
