name: PastureStack / Container CI

on:
  pull_request:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build without publishing
        shell: bash
        run: docker build --pull --tag local/verification:${{ github.sha }} .
