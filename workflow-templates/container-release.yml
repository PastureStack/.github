name: PastureStack / Container release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Numeric semantic version, optionally prefixed with v.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: PastureStack/.github/.github/workflows/container-release.yml@main
    with:
      image-name: ${{ github.event.repository.name }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
